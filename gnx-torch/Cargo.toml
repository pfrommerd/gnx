[package]
name = "gnx-torch"
version = "0.1.0"
edition = "2024"
links = "gnx_torch"

[features]
cuda = ["torch-sys/gnx-cuda"]

[dependencies]
futures-channel = "0.3"
futures-executor = "0.3"
rkyv = "0.8.18"
gnx-common = { path = "../gnx-common" }
gnx-expr = { path = "../gnx-expr" }
gnx-math = { path = "../gnx-math" }
gnx-transforms = { path = "../gnx-transforms" }
tch = "=0.22.0"
torch-sys = { version = "=0.22.0", features = ["gnx-managed"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
gnx = { path = "../gnx" }

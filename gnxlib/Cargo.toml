[package]
name = "gnxlib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gnxlib"
crate-type = ["cdylib"]
test = false # The extension is tested from Python.

[features]
xla = ["dep:gnx-xla", "gnx-xla/native"]
xla-mesh = ["xla", "gnx-xla/mesh", "dep:tokio"]

[dependencies]
gnx-xla = { version = "0.1.0", path = "../gnx-xla", optional = true }
gnx = { version = "0.1.0", path = "../gnx" }
pyo3 = { version = "0.28.3", features = ["abi3-py310", "experimental-async", "num-bigint", "uuid"] }
num-bigint = "0.4.6"
numpy = "0.28"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
gnx-jax = { version = "0.1.0", path = "../gnx-jax" }
uuid = "1.19.0"

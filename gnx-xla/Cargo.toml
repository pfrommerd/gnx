[package]
name = "gnx-xla"
version = "0.1.0"
edition = "2024"

[features]
default = []
native = ["dep:cc", "dep:xla", "dep:futures-channel", "dep:gnx-array", "dep:gnx-transforms"]

[dependencies]
futures-channel = { version = "0.3", optional = true }
gnx-expr = { path = "../gnx-expr" }
gnx-math = { path = "../gnx-math" }
gnx-array = { path = "../gnx-array", optional = true }
gnx-transforms = { path = "../gnx-transforms", optional = true }
xla = { version = "=0.5.5", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
futures-executor = "0.3"
gnx = { path = "../gnx" }
gnx-graph = { path = "../gnx-graph" }

[package]
name = "gnx-xla"
version = "0.1.0"
edition = "2024"

[features]
default = ["lapack"]
lapack = ["xla/lapack"]
cuda = ["xla/cuda"]

[dependencies]
futures-channel = "0.3"
futures-executor = "0.3"
rkyv = "0.8.18"
gnx-expr = { path = "../gnx-expr" }
gnx-math = { path = "../gnx-math" }
gnx-common = { path = "../gnx-common" }
gnx-transforms = { path = "../gnx-transforms" }
xla = { package = "gnx-xla-sys", path = "../gnx-xla-sys", features = ["pjrt"] }

[dev-dependencies]
futures-util = "0.3.34"
gnx = { path = "../gnx" }
gnx-graph = { path = "../gnx-graph" }

[package]
name = "gnx-xla"
version = "0.1.0"
edition = "2024"

[features]
default = ["lapack"]
lapack = ["xla/lapack"]
cuda = ["xla/cuda"]

[dependencies]
futures-channel = "0.3"
gnx-expr = { path = "../gnx-expr" }
gnx-math = { path = "../gnx-math" }
gnx-array = { path = "../gnx-array" }
gnx-transforms = { path = "../gnx-transforms" }
xla = { version = "=0.5.5", features = ["pjrt"] }

[dev-dependencies]
futures-executor = "0.3"
gnx = { path = "../gnx" }
gnx-graph = { path = "../gnx-graph" }

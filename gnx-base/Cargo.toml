[package]
name = "gnx-base"
version = "0.1.0"
edition = "2024"

[dependencies]
gnx-expr = { path = "../gnx-expr" }
rkyv = "0.8.18"
object_store = { version = "0.13.2", features = ["tokio"] }
thiserror = "2"
paste = "1.0.15"
ordered-float = "5.3.0"
uuid = { version = "1.19.0", features = ["v4"] }
memmap2 = "0.9.12"
blake3 = "1"
async-trait = "0.1.92"
futures-util = "0.3.34"
bytes = "1.12.2"
anyhash = { version = "0.1.4", features = ["std"] }

[dev-dependencies]
futures-executor = "0.3.34"
tempfile = "3.27.0"

[workspace]
members = [
    "gnx",
    "gnx-base",
    "gnx-cuda-build",
    "gnx-transforms",
    "gnx-derive",
    "gnx-expr",
    "gnx-graph",
    "gnx-io",
    "gnx-io-derive",
    "gnx-torch",
    "gnx-xla",
    "gnx-xla-sys",
    "gnxlib", "gnx-math",
    "gnx-nn",
    "gnx-models",
]
exclude = ["gnx-torch/vendor/torch-sys"]
resolver = "3"

[patch.crates-io]
# Resolve the verified runtime before tch's own native bindings are built.
torch-sys = { path = "gnx-torch/vendor/torch-sys" }

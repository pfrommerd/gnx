[package]
edition = "2021"
name = "gnx-xla-sys"
version = "0.5.5"
authors = ["laurent <laurent.mazare@gmail.com>"]
build = "build.rs"
links = "xla_extension"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bindings for the XLA C++ library."
readme = "README.md"
keywords = [
    "blas",
    "tensor",
    "machine-learning",
]
categories = ["science"]
license = "MIT/Apache-2.0"
repository = "https://github.com/LaurentMazare/xla-rs"

[features]
cuda = []
pjrt = []
cpu-pjrt = ["pjrt"]
lapack = []

[lib]
path = "src/lib.rs"

[dependencies.log]
version = "0.4"

[dependencies.libc]
version = "0.2"

[dependencies.num-derive]
version = "0.4"

[dependencies.num-traits]
version = "0.2"

[dependencies.thiserror]
version = "1"

[dependencies.zip]
version = "9.1.3"
features = ["deflate"]
default-features = false

[build-dependencies.clang-sys]
version = "1"
features = ["runtime"]

[build-dependencies.zip]
version = "9.1.3"
features = ["deflate"]
default-features = false

[build-dependencies.tempfile]
version = "3"

[build-dependencies.bindgen]
version = "0.72"

[build-dependencies.gnx-cuda-build]
path = "../gnx-cuda-build"

[build-dependencies.cc]
version = "1.0"
